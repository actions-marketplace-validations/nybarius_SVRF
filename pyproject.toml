[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "svrf"
version = "0.3.0"
description = "Silicon Valley Rocket Fuel: a merge train for repositories where agents open pull requests faster than CI can gate them one by one"
readme = "README.md"
license = "LicenseRef-PolyForm-Shield-1.0.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
dependencies = []
authors = [
  { name = "Stephen Schweizer" },
]
keywords = ["merge queue", "merge train", "github actions", "ci", "pull requests"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: POSIX :: Linux",
  "Topic :: Software Development :: Version Control :: Git",
  "Topic :: Software Development :: Build Tools",
]

[project.urls]
Homepage = "https://github.com/nybarius/SVRF"
Repository = "https://github.com/nybarius/SVRF"
Issues = "https://github.com/nybarius/SVRF/issues"
Changelog = "https://github.com/nybarius/SVRF/blob/main/CHANGELOG.md"

[project.scripts]
svrf = "svrf.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
svrf = ["dashboard.html"]
